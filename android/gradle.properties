org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Keep Java selection environment-specific; do not hard-code a developer machine path.

# --- Build Speed Optimizations ---
# Run independent tasks in parallel (multi-module projects)
org.gradle.parallel=true
# Reuse task outputs from previous builds
org.gradle.caching=true
# Skip configuration phase on repeated builds (huge win for incremental builds)
org.gradle.configuration-cache=true
# Watch filesystem to avoid redundant stat calls between builds
org.gradle.vfs.watch=true
